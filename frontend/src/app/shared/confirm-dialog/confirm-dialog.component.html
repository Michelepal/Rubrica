@if (open) {
  <div class="modal-backdrop" role="presentation" (click)="cancelled.emit()">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title" (click)="$event.stopPropagation()">
      <header class="modal__header">
        <h2 id="confirm-title">{{ title }}</h2>
      </header>
      <p>{{ message }}</p>
      <footer class="modal__actions">
        @if (showCancel) {
          <button class="button button--secondary" type="button" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        }
        <button class="button" [class.button--danger]="destructive" type="button" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </footer>
    </section>
  </div>
}
