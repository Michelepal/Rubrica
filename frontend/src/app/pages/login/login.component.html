<main class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="login-title">
    <div class="brand"><span class="brand__mark">R</span><span>rubricaJavaAngular</span></div>
    <h1 id="login-title">Accesso</h1>
    <p>Entra nella tua rubrica personale.</p>

    <label for="username">Username</label>
    <input id="username" formControlName="username" autocomplete="username">

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password">

    @if (errorMessage) {
      <div class="form-error" role="alert">
        <span>{{ errorMessage }}</span>
        <button class="form-error__dismiss" type="button" aria-label="Chiudi messaggio di errore" (click)="dismissError()">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    }

    <button class="button" type="submit">Accedi</button>
  </form>
</main>
