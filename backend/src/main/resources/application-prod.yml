spring:
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:h2:file:./data/rubrica-prod}
    username: ${APP_DATASOURCE_USERNAME:sa}
    password: ${APP_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    it.michelepal.rubrica: INFO
    org.springframework.security: WARN

app:
  cors:
    allowed-origins: []

